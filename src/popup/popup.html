<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crapless Expander</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-block">
                <h2>OpenTextExpander <span id="statusIndicator" class="status-indicator" title="Loading...">⏳</span></h2>
                <p class="subtitle">Manage profiles, expansions, and shortcuts</p>
            </div>
        </div>

        <div class="profile-bar">
            <label id="profileLabel" for="profileSelect" class="profile-label">Profiles</label>
            <div class="profile-controls">
                <select id="profileSelect" class="profile-select"></select>
                <button id="addProfileBtn" class="icon-btn square-btn" type="button" title="Add profile">+</button>
                <button id="profileMenuBtn" class="icon-btn menu-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Profile menu">⋯</button>
            </div>
            <div id="profileMenu" class="profile-menu" hidden>
                <button type="button" data-action="add-profile"></button>
                <button type="button" data-action="copy-profile"></button>
                <button type="button" data-action="rename-profile"></button>
                <button type="button" data-action="import-profiles"></button>
                <button type="button" data-action="export-profile"></button>
                <button type="button" data-action="export-all-profiles"></button>
                <button type="button" data-action="delete-profile" class="danger"></button>
                <button type="button" data-action="delete-all-profiles" class="danger"></button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="expansions" type="button">Text Expansions</button>
            <button class="tab-button" data-tab="shortcuts" type="button">Keyboard Shortcuts</button>
        </div>

        <div id="expansions" class="tab-content active">
            <div id="expansionsList" class="list">
                <div class="empty-state">No expansions yet. Add one to get started!</div>
            </div>

            <div class="controls">
                <button id="addExpansionBtn" class="btn btn-primary" type="button">+ Add Expansion</button>
                <label class="checkbox"><input type="checkbox" id="punctAware"> Punctuation aware</label>
                <label class="checkbox"><input type="checkbox" id="caseSensitive"> Case sensitive</label>
            </div>
        </div>

        <div id="shortcuts" class="tab-content">
            <div id="shortcutsList" class="list">
                <div class="empty-state">No shortcuts yet. Add one to get started!</div>
            </div>

            <div class="controls">
                <button id="addShortcutBtn" class="btn btn-primary" type="button">+ Add Shortcut</button>
            </div>
        </div>

        <div class="utility-buttons">
            <div class="utility-links">
                <a href="#" id="testPageLink" class="btn btn-secondary">Test Page</a>
                <a href="#" id="githubLink" class="btn btn-github">GitHub</a>
            </div>
        </div>

        <button id="langSwitcher" class="lang-switcher" type="button">Lang: EN</button>
    </div>

    <div id="expansionModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="expansionModal">&times;</span>
            <h2>Edit Expansion</h2>
            <form id="expansionForm">
                <div class="form-group">
                    <label for="expansionTrigger">Trigger (e.g., '\man'):</label>
                    <input type="text" id="expansionTrigger" required placeholder="\man">
                </div>
                <div class="form-group">
                    <label for="expansionReplacement">Replacement Text:</label>
                    <textarea id="expansionReplacement" required placeholder="manuscript"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" id="deleteExpansionBtn">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <div id="shortcutModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="shortcutModal">&times;</span>
            <h2>Edit Shortcut</h2>
            <form id="shortcutForm">
                <div class="form-group">
                    <label>Keys:</label>
                    <div class="key-input">
                        <label class="checkbox">
                            <input type="checkbox" id="ctrlKey"> Ctrl
                        </label>
                        <label class="checkbox">
                            <input type="checkbox" id="shiftKey"> Shift
                        </label>
                        <label class="checkbox">
                            <input type="checkbox" id="altKey"> Alt
                        </label>
                        <input type="text" id="mainKey" placeholder="Key (e.g., 'm')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="shortcutText">Text to Insert:</label>
                    <textarea id="shortcutText" required placeholder="manuscript"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" id="deleteShortcutBtn">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content warning-modal">
            <span class="close" data-close="confirmModal">&times;</span>
            <h2 id="confirmTitle">Warning</h2>
            <div id="confirmWarning" class="warning-box"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmActionBtn">Delete</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
